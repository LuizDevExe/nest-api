# Postgres para desenvolvimento e testes. A API roda fora (npm run start:dev)
# ou dentro, com o perfil "app": docker compose --profile app up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://forum:forum@db:5432/forum?schema=public
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env (mínimo 32 caracteres)}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
